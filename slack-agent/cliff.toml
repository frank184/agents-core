# git-cliff configuration for Slack Documentation Agent
# Generates CHANGELOG.md from conventional commits

[changelog]
# Changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

<!-- generated by git-cliff -->
"""

# Template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
    - {% if commit.breaking %}⚠️ BREAKING: {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""

# Template for the footer
footer = """
{% for release in releases %}
    {%- if release.version -%}
        {% if loop.first %}\
## Links

{% endif %}\
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/user/repo/compare/{% if release.previous %}{{ release.previous.version }}{% else %}v0.0.0{% endif %}...{{ release.version }}
    {%- endif -%}
{% endfor %}
"""

# Commit pattern definitions
[[git.commit.parsers]]
message = "^feat"
group = "Features"

[[git.commit.parsers]]
message = "^fix"
group = "Bug Fixes"

[[git.commit.parsers]]
message = "^doc"
group = "Documentation"

[[git.commit.parsers]]
message = "^perf"
group = "Performance"

[[git.commit.parsers]]
message = "^refactor"
group = "Refactoring"

[[git.commit.parsers]]
message = "^style"
group = "Styling"

[[git.commit.parsers]]
message = "^test"
group = "Testing"

[[git.commit.parsers]]
message = "^build"
group = "Build"

[[git.commit.parsers]]
message = "^ci"
group = "CI/CD"

[[git.commit.parsers]]
message = "^chore"
group = "Chore"

[[git.commit.parsers]]
message = "^revert"
group = "Revert"

# Ignore commit patterns
[[git.commit.parsers]]
message = "^skip"
skip = true

# Detect breaking changes
[git.commit.conventional]
commit_type = "feat"
breaking_changes = [
    { footer = "BREAKING CHANGE" }
]
