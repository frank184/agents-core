version: '3.9'

services:
  slack-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slack-documentation-agent
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DOC_STORAGE_PATH=/app/processed_docs
    volumes:
      - ./processed_docs:/app/processed_docs
      - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test: ["CMD", "node", "-e", "console.log(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: nginx reverse proxy for monitoring endpoints (future)
  # nginx:
  #   image: nginx:alpine
  #   container_name: slack-bot-proxy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - slack-bot
  #   restart: unless-stopped

volumes:
  processed_docs:
    driver: local
  logs:
    driver: local
